# Smithery configuration file for FastrMemory
# Enables 1-click installation across Claude Desktop, Cursor, and Windsurf via Smithery CLI
# Documentation: https://smithery.ai/docs/config

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    () => ({ command: 'npx', args: ['-y', 'fastrmemory@0.3.1', 'mcp'] })
