<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>FastrMemory Hub</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark flash.
      (function () {
        var mode = 'system';
        try { mode = localStorage.getItem('fastr-theme') || 'system'; } catch (e) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
