name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install UI dependencies
        run: npm --prefix ui ci --ignore-scripts

      - name: Verify tracked UI bundle
        run: npm run check:dist-ui

      - name: Typecheck & Build core
        run: npm run build:core

      - name: Build UI and verify tracked bundle
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        run: |
          npm run build:ui
          git diff --exit-code -- dist-ui

      - name: Run full checks
        run: npm run check:ci
