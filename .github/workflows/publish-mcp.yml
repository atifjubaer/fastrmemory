name: Publish to MCP Registry

# Publishes the root server.json to the official Model Context Protocol registry.
#
# Separate from release.yml on purpose:
#   - npm publishing and registry publishing have different failure modes, and the registry is
#     still a preview service that may reset its data.
#   - A registry publish must be re-runnable without touching npm, because an npm version is
#     immutable once published.
#
# Runs only on demand, after the npm release is verified. Authentication is GitHub OIDC, so no
# long-lived token is stored anywhere; the `name` in server.json is `io.github.atifjubaer/...`,
# which is the namespace this repository proves ownership of.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v0.6.0)'
        required: true
        type: string
      ref:
        description: 'Branch or tag holding server.json (default: main)'
        required: false
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-${{ inputs.tag }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.4
  # SHA-256 of mcp-publisher_linux_amd64.tar.gz for the pinned release, from the release's
  # published checksum file. cosign also verifies the Sigstore bundle before extraction.
  MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
  SERVER_NAME: io.github.atifjubaer/fastrmemory

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # server.json is repo metadata, not part of the npm tarball's behaviour, and a release tag
      # is immutable. Checking out `ref` (default main) lets a metadata fix ship without a
      # retag; the version check below still forces ref to describe the same release.
      - name: Check out server.json
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # The registry rejects a server.json whose version does not resolve to a published
      # package, so the tag, package.json, and server.json must all agree before we start.
      - name: Verify the tag matches the manifests
        run: |
          node scripts/check-release-version.mjs "${{ inputs.tag }}"
          node -e '
            const tag = process.env.TAG;
            const server = require("./server.json");
            if (server.version !== tag.replace(/^v/, "")) {
              console.error(`server.json version ${server.version} != tag ${tag}`);
              process.exit(1);
            }
            console.log(`server.json ${server.version} matches ${tag}; description ${server.description.length}/100 characters`);
          '
        env:
          TAG: ${{ inputs.tag }}

      - name: Wait for npm to serve the version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          for attempt in $(seq 1 30); do
            PUBLISHED=$(npm view "fastrmemory@${VERSION}" version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "npm serves fastrmemory@$VERSION"
              exit 0
            fi
            echo "attempt $attempt: npm has no fastrmemory@$VERSION yet"
            sleep 20
          done
          echo "npm never served fastrmemory@$VERSION" >&2
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher --help

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

      - name: Verify the registry record
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for attempt in $(seq 1 15); do
            # --data-urlencode keeps the namespace slash from being parsed as a path segment.
            if curl --fail --silent --show-error --get \
              --data-urlencode "search=${SERVER_NAME}" \
              "https://registry.modelcontextprotocol.io/v0.1/servers" \
              -o registry-response.json; then
              if VERSION="$VERSION" SERVER_NAME="$SERVER_NAME" node -e '
                const fs = require("node:fs");
                const body = JSON.parse(fs.readFileSync("registry-response.json", "utf8"));
                const wanted = { name: process.env.SERVER_NAME, version: process.env.VERSION };
                let found = false;
                const walk = (node) => {
                  if (found || node === null || typeof node !== "object") return;
                  if (node.name === wanted.name && node.version === wanted.version) {
                    found = true;
                    return;
                  }
                  for (const value of Object.values(node)) walk(value);
                };
                walk(body);
                if (!found) process.exit(1);
              '; then
                echo "Registry lists ${SERVER_NAME}@${VERSION}"
                exit 0
              fi
            fi
            echo "attempt $attempt: registry does not list ${SERVER_NAME}@${VERSION} yet"
            sleep 10
          done
          echo "Registry never listed ${SERVER_NAME}@${VERSION}" >&2
          exit 1
