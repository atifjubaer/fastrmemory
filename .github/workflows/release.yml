name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v0.3.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      FASTR_PERF_GATE: '1'
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify release version
        run: node scripts/check-release-version.mjs "${{ inputs.tag || github.ref_name }}"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install UI dependencies
        run: npm --prefix ui ci --ignore-scripts

      - name: Build core
        run: npm run build:core

      - name: Run full release gate
        run: npm run check:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Pack release tarball
        id: pack
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          TARBALL="release/fastrmemory-${VERSION}.tgz"
          test -f "$TARBALL"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Verify clean tarball install
        run: |
          CLEAN_DIR=$(mktemp -d)
          npm install --prefix "$CLEAN_DIR" --ignore-scripts "$(pwd)/${{ steps.pack.outputs.tarball }}"
          INSTALLED_VERSION=$("$CLEAN_DIR/node_modules/.bin/fastr" --version)
          test "$INSTALLED_VERSION" = "${{ steps.pack.outputs.version }}"
          echo "Installed tarball reports $INSTALLED_VERSION"

      - name: Publish to npm with provenance
        run: npm publish "$(pwd)/${{ steps.pack.outputs.tarball }}" --provenance --access public

      - name: Verify registry publication
        run: |
          VERSION="${{ steps.pack.outputs.version }}"
          PUBLISHED=""
          for attempt in $(seq 1 12); do
            PUBLISHED=$(npm view "fastrmemory@${VERSION}" version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$VERSION" ]; then break; fi
            sleep 10
          done
          test "$PUBLISHED" = "$VERSION"
          echo "Registry reports fastrmemory@$PUBLISHED"

      - name: Create GitHub Release
        run: |
          gh release create "${{ inputs.tag || github.ref_name }}" \
            "${{ steps.pack.outputs.tarball }}" \
            "${{ steps.pack.outputs.tarball }}.sha256" \
            --title "FastrMemory ${{ steps.pack.outputs.version }}" \
            --generate-notes \
            --verify-tag
